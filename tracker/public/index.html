<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tracker</title>
    <meta name="description" content="Track anything: todos, habits, budget, or inventory, with live stats.">
    <meta name="theme-color" content="#0b0d12">
    <link rel="icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22><rect%20x=%2212%22%20y=%2212%22%20width=%2276%22%20height=%2276%22%20rx=%2218%22%20fill=%22%235b8cff%22/></svg>">
    <!-- Social share preview (Open Graph + Twitter). When you brand this app, update the
         title/description here and swap og:image & twitter:image for your own 1200x630 image. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tracker">
    <meta property="og:description" content="Track anything: todos, habits, budget, or inventory, with live stats.">
    <meta property="og:image" content="https://vibekit.bot/public/og-vibekit.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tracker">
    <meta name="twitter:description" content="Track anything: todos, habits, budget, or inventory, with live stats.">
    <meta name="twitter:image" content="https://vibekit.bot/public/og-vibekit.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1 id="app-title">Tracker</h1>
    <p id="app-subtitle">Add items, check them off, keep a running total.</p>
  </header>

  <main>
    <form id="add-form" autocomplete="off">
      <label class="sr-only" for="title">What are you tracking?</label>
      <input id="title" type="text" placeholder="What are you tracking?" required>
      <label class="sr-only" for="note">Note (optional)</label>
      <input id="note" type="text" placeholder="Note (optional)">
      <label class="sr-only" for="amount">Amount (optional)</label>
      <input id="amount" type="number" step="any" placeholder="Amount (optional)" inputmode="decimal">
      <button type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </form>

    <section class="stats" id="stats">
      <div class="stat"><span class="num" id="stat-active">0</span><span class="label">Active</span></div>
      <div class="stat"><span class="num" id="stat-done">0</span><span class="label">Done</span></div>
      <div class="stat"><span class="num" id="stat-total">0</span><span class="label">Total</span></div>
      <div class="stat"><span class="num" id="stat-amount">0</span><span class="label">Amount</span></div>
    </section>

    <nav class="filters" id="filters">
      <button data-filter="all" class="active" aria-pressed="true">All</button>
      <button data-filter="active" aria-pressed="false">Active</button>
      <button data-filter="done" aria-pressed="false">Done</button>
    </nav>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet. Add your first item above.</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
