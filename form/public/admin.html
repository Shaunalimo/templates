<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Responses · Admin</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f7f8fb" />
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22><rect%20x=%2212%22%20y=%2212%22%20width=%2276%22%20height=%2276%22%20rx=%2218%22%20fill=%22%235046e5%22/></svg>" />
<link rel="stylesheet" href="/styles.css" />
<style>
  body.admin-body { display: block; }
  .brand-lg { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; color: var(--text); }
  .brand-lg span { color: var(--accent); }

  /* Setup / login card */
  .gate { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .gate-card {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 30px 26px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
  }
  .gate-card p { margin: 0; font-size: .92rem; color: var(--muted); }
  .gate-card input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--text);
    background: var(--field); border: 1px solid var(--border-strong); border-radius: 10px; padding: 11px 13px;
  }
  .gate-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .gate-error { color: var(--danger); font-size: .88rem; }

  .btn2 { font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; border-radius: 10px; padding: 10px 16px; min-height: 42px; border: 1px solid transparent; transition: filter 140ms ease, background 140ms ease, color 140ms ease; }
  .btn2.primary { background: var(--accent); color: #fff; }
  .btn2.primary:hover { background: var(--accent-hover); }
  .btn2.ghost { background: transparent; color: var(--muted); border-color: var(--border-strong); }
  .btn2.ghost:hover { color: var(--text); border-color: var(--text); }

  /* Dashboard shell */
  .dash-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 16px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); z-index: 5;
  }
  .dash-actions { display: flex; gap: 8px; align-items: center; }
  .dash-wrap { max-width: 1080px; margin: 0 auto; padding: 22px 22px 60px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .stat .k { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .stat .v { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px; }
  .stat .v small { font-size: .95rem; font-weight: 500; color: var(--muted); }
  .bars { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 10px; font-size: .82rem; }
  .bar-row .lbl { color: var(--muted); text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .track { height: 8px; background: var(--field); border-radius: 6px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .bar-row .n { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }

  .panel-title { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 26px 2px 12px; }

  .resp-list { display: flex; flex-direction: column; gap: 10px; }
  .resp {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .resp summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: baseline; }
  .resp summary::-webkit-details-marker { display: none; }
  .resp .who { font-weight: 650; }
  .resp .who .role { color: var(--muted); font-weight: 500; text-transform: capitalize; }
  .resp .when { color: var(--muted); font-size: .82rem; white-space: nowrap; }
  .resp .stars { color: var(--star); letter-spacing: 1px; font-size: .95rem; }
  .resp .stars .off { color: var(--border-strong); }
  .resp-detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; font-size: .9rem; }
  .resp-detail dt { color: var(--muted); }
  .resp-detail dd { margin: 0; }
  .chip { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 600; margin: 0 4px 4px 0; }
  .email-link { color: var(--accent); text-decoration: none; }
  .email-link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty a { color: var(--accent); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); background: var(--text); color: var(--bg); font-weight: 600; font-size: .9rem; padding: 11px 18px; border-radius: 10px; box-shadow: var(--shadow); opacity: 0; transition: opacity 220ms ease, transform 220ms ease; z-index: 50; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body class="admin-body">
  <div id="setup" class="gate" hidden>
    <form id="setup-form" class="gate-card">
      <div class="brand-lg">Responses <span>Admin</span></div>
      <p>Create a password to protect your responses — you'll use it to view and export them. Do this now, before sharing your form.</p>
      <input id="setup-password" type="password" placeholder="Create a password (min 6 characters)" autocomplete="new-password" />
      <input id="setup-confirm" type="password" placeholder="Confirm password" autocomplete="new-password" />
      <button type="submit" class="btn2 primary">Create admin</button>
      <div id="setup-error" class="gate-error" hidden></div>
    </form>
  </div>

  <div id="login" class="gate" hidden>
    <form id="login-form" class="gate-card">
      <div class="brand-lg">Responses <span>Admin</span></div>
      <p>Enter your admin password to view responses.</p>
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" />
      <button type="submit" class="btn2 primary">Sign in</button>
      <div id="login-error" class="gate-error" hidden></div>
    </form>
  </div>

  <div id="app" hidden>
    <header class="dash-top">
      <div class="brand-lg">Responses <span>Admin</span></div>
      <div class="dash-actions">
        <a href="/" target="_blank" rel="noopener" class="btn2 ghost">View form ↗</a>
        <a id="export" href="/admin/export.csv" class="btn2 ghost">Export CSV</a>
        <button id="signout" class="btn2 ghost">Sign out</button>
      </div>
    </header>
    <div class="dash-wrap">
      <div class="stats" id="stats"></div>
      <div id="feature-panel"></div>
      <div class="panel-title">Responses</div>
      <div class="resp-list" id="resp-list"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>
